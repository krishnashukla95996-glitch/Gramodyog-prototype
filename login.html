<!DOCTYPE html>
<html>
<head>
<title>Gramodyog - Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial
}

body{
    background:#f5f8f4;
    color:#18352a
}

nav{
    height:70px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
    box-shadow:0 2px 10px #0001
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#176b45
}

a{
    color:#176b45;
    text-decoration:none
}

main{
    max-width:430px;
    margin:70px auto;
    padding:20px
}

.head{
    text-align:center;
    margin-bottom:25px
}

.head h1{
    font-size:32px;
    margin-bottom:8px
}

.head p{
    color:#66756e
}

.card{
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 8px 30px #0001
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-bottom:18px
}

label{
    font-weight:bold;
    font-size:14px
}

input{
    padding:13px;
    border:1px solid #ccd8d1;
    border-radius:9px;
    font-size:14px;
    outline:none
}

input:focus{
    border-color:#176b45;
    box-shadow:0 0 0 3px #176b4515
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:9px;
    background:#176b45;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer
}

button:hover{
    background:#125638
}

.login-option{
    display:flex;
    gap:10px;
    margin-bottom:18px
}

.option-btn{
    flex:1;
    padding:11px;
    border:1px solid #ccd8d1;
    background:#f8faf8;
    color:#527064;
    font-size:13px;
    border-radius:8px;
    cursor:pointer
}

.option-btn.active{
    background:#e1ebe5;
    color:#176b45;
    border-color:#176b45;
}

.google-btn{
    width:100%;
    margin-top:20px;
    padding:13px;
    background:white;
    color:#18352a;
    border:1px solid #ccd8d1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.google-btn:hover{
    background:#f7f9f7;
}

.google-icon{
    font-size:18px;
    font-weight:bold;
}

.divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:22px 0;
    color:#9aa59f;
    font-size:12px
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#e0e5e2
}

.note{
    text-align:center;
    margin-top:20px;
    font-size:13px;
    color:#74827b
}

.forgot{
    text-align:right;
    margin-top:-8px;
    margin-bottom:18px;
    font-size:12px
}

@media(max-width:500px){
    main{
        margin:40px auto
    }

    .card{
        padding:25px
    }
}
</style>
</head>


<body>

<nav>

<div class="logo">
    <img
            src="C:\Users\Dell\prototype\gramodyog-logo.png.png"
            alt="Gramodyog Logo" height="50"
        > Gramodyog
</div>

<a href="index.html">
    ← Home
</a>

</nav>


<main>

<div class="head">

<h1>Welcome Back</h1>

<p>
    Login to continue your business journey.
</p>

</div>


<div class="card">


<!-- Login Method -->

<div class="login-option">

<button
    type="button"
    class="option-btn active"
    onclick="showMobile()"
    id="mobileOption">
    📱 Mobile
</button>

<button
    type="button"
    class="option-btn"
    onclick="showEmail()"
    id="emailOption">
    📧 Email
</button>

</div>


<form onsubmit="login(event)">

<!-- Mobile Login -->

<div id="mobileLogin">

<div class="field">

<label>
    Mobile Number
</label>

<input
    type="tel"
    placeholder="Enter mobile number"
    maxlength="10"
    required
>

</div>

</div>


<!-- Email Login -->

<div id="emailLogin" style="display:none">

<div class="field">

<label>
    Email Address
</label>

<input
    type="email"
    placeholder="Enter email address"
>

</div>

</div>


<!-- Password -->

<div class="field">

<label>
    Password
</label>

<input
    type="password"
    placeholder="Enter password"
    required
>

</div>


<div class="forgot">

<a href="#">
    Forgot Password?
</a>

</div>


<button type="submit">
    Login →
</button>

</form>


<!-- Divider -->

<div class="divider">
    OR
</div>


<!-- Google Login -->

<button
    type="button"
    class="google-btn"
    onclick="googleLogin()">

<span class="google-icon">
    G
</span>

Continue with Google

</button>


<div class="note">

New to Gramodyog?

<a href="register.html">
    Create an account
</a>

</div>

</div>

</main>


<script>

function showMobile(){

    document.getElementById("mobileLogin").style.display="block";

    document.getElementById("emailLogin").style.display="none";

    document.getElementById("mobileOption").classList.add("active");

    document.getElementById("emailOption").classList.remove("active");

    document.querySelector("#mobileLogin input").required=true;

    document.querySelector("#emailLogin input").required=false;
}


function showEmail(){

    document.getElementById("mobileLogin").style.display="none";

    document.getElementById("emailLogin").style.display="block";

    document.getElementById("mobileOption").classList.remove("active");

    document.getElementById("emailOption").classList.add("active");

    document.querySelector("#mobileLogin input").required=false;

    document.querySelector("#emailLogin input").required=true;
}


function login(e){

    e.preventDefault();

    window.location.href="personal.html";

}


function googleLogin(){

    alert("Google Login will be connected here.");

}

</script>

</body>
</html>
